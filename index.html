<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#234783" />
  <meta name="description" content="Dental Marechal – Especializada em Equipamentos Odontológicos. Seu parceiro desde 2005. Centro, Curitiba – PR." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg:            #EFEFEF;
      --primary:       #234783;
      --primary-dark:  #162d56;
      --primary-mid:   #1e3f77;
      --primary-light: #2d5a9e;
      --white:         #ffffff;
      --shadow-sm: rgba(35, 71, 131, 0.12);
      --shadow-md: rgba(35, 71, 131, 0.22);
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg);
      font-family: 'DM Sans', sans-serif;
      color: var(--primary);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 32px 20px;
    }

    /* subtle radial background accents */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 15% 10%, rgba(35,71,131,0.07) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 85% 90%, rgba(35,71,131,0.05) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ────────────────────────────────────────
       CONTAINER
    ──────────────────────────────────────── */
    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ────────────────────────────────────────
       LOGO
    ──────────────────────────────────────── */
    .logo-wrap {
      margin-bottom: 24px;
      opacity: 0;
      transform: translateY(-18px);
      animation: fadeDown 0.75s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
    }

    .logo-wrap svg {
      width: 108px;
      height: auto;
      filter: drop-shadow(0 6px 20px rgba(35,71,131,0.2));
    }

    /* ────────────────────────────────────────
       TITLE
    ──────────────────────────────────────── */
    .title {
      font-size: clamp(26px, 7.5vw, 34px);
      font-weight: 700;
      color: var(--primary-dark);
      letter-spacing: -0.6px;
      text-align: center;
      line-height: 1.15;
      opacity: 0;
      transform: translateY(16px);
      animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.35s forwards;
    }

    /* ────────────────────────────────────────
       DIVIDER
    ──────────────────────────────────────── */
    .divider {
      width: 44px;
      height: 3px;
      background: linear-gradient(90deg, var(--primary-light), var(--primary));
      border-radius: 999px;
      margin: 14px 0;
      transform-origin: center;
      transform: scaleX(0);
      opacity: 0;
      animation: scaleLine 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.55s forwards;
    }

    /* ────────────────────────────────────────
       SUBTITLE
    ──────────────────────────────────────── */
    .subtitle {
      font-size: 14px;
      font-weight: 400;
      color: var(--primary-light);
      letter-spacing: 0.4px;
      text-align: center;
      margin-bottom: 40px;
      opacity: 0;
      transform: translateY(14px);
      animation: fadeUp 0.65s cubic-bezier(0.22, 1, 0.36, 1) 0.5s forwards;
    }

    /* ────────────────────────────────────────
       BUTTONS
    ──────────────────────────────────────── */
    .buttons {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 16px 18px;
      border-radius: 18px;
      text-decoration: none;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      border: none;
      outline: none;
      transition:
        transform   0.2s cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow  0.2s cubic-bezier(0.22, 1, 0.36, 1),
        background  0.2s ease,
        filter      0.2s ease;
      -webkit-user-select: none;
      user-select: none;
      opacity: 0;
      transform: translateY(22px);
    }

    .btn:focus-visible {
      outline: 3px solid var(--primary-light);
      outline-offset: 2px;
    }

    @media (hover: hover) {
      .btn:hover {
        transform: translateY(-3px);
      }
    }

    .btn:active {
      transform: scale(0.97) translateY(0) !important;
      filter: brightness(0.96);
    }

    /* icon box */
    .btn-icon {
      width: 46px;
      height: 46px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .btn-icon svg {
      width: 22px;
      height: 22px;
    }

    /* text stack */
    .btn-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .btn-label {
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.9px;
      opacity: 0.7;
      line-height: 1;
    }

    .btn-value {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.35;
      white-space: pre-line;
    }

    /* ── Map ── */
    .btn-map {
      background: var(--primary);
      color: var(--white);
      box-shadow: 0 8px 28px var(--shadow-md);
      animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.65s forwards;
    }

    @media (hover: hover) {
      .btn-map:hover {
        background: var(--primary-mid);
        box-shadow: 0 12px 32px rgba(35,71,131,0.32);
      }
    }

    .btn-map .btn-icon {
      background: rgba(255, 255, 255, 0.16);
    }

    /* ── WhatsApp ── */
    .btn-whatsapp {
      background: var(--white);
      color: var(--primary);
      box-shadow: 0 4px 16px var(--shadow-sm);
      border: 1.5px solid rgba(35,71,131,0.1);
      animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.78s forwards;
    }

    @media (hover: hover) {
      .btn-whatsapp:hover {
        background: #f5f9ff;
        box-shadow: 0 8px 22px rgba(35,71,131,0.16);
      }
    }

    .btn-whatsapp .btn-icon {
      background: #25D366;
    }

    /* ── Phone ── */
    .btn-phone {
      background: var(--white);
      color: var(--primary);
      box-shadow: 0 4px 16px var(--shadow-sm);
      border: 1.5px solid rgba(35,71,131,0.1);
      animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.91s forwards;
    }

    @media (hover: hover) {
      .btn-phone:hover {
        background: #f5f9ff;
        box-shadow: 0 8px 22px rgba(35,71,131,0.16);
      }
    }

    .btn-phone .btn-icon {
      background: var(--primary-light);
    }

    /* ── Instagram ── */
    .btn-instagram {
      background: var(--white);
      color: var(--primary);
      box-shadow: 0 4px 16px var(--shadow-sm);
      border: 1.5px solid rgba(35,71,131,0.1);
      animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 1.04s forwards;
    }

    @media (hover: hover) {
      .btn-instagram:hover {
        background: #f5f9ff;
        box-shadow: 0 8px 22px rgba(35,71,131,0.16);
      }
    }

    .btn-instagram .btn-icon {
      background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
    }

    /* ────────────────────────────────────────
       FOOTER
    ──────────────────────────────────────── */
    .footer {
      margin-top: 40px;
      font-size: 11.5px;
      font-weight: 400;
      color: var(--primary);
      letter-spacing: 0.2px;
      text-align: center;
      opacity: 0;
      animation: footerFade 0.6s ease 1.15s forwards;
    }

    /* ────────────────────────────────────────
       KEYFRAMES
    ──────────────────────────────────────── */
    @keyframes fadeDown {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes scaleLine {
      to { opacity: 1; transform: scaleX(1); }
    }

    @keyframes footerFade {
      to { opacity: 0.38; }
    }
  </style>
</head>
